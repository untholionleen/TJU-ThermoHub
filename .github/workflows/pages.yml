name: Verify and deploy TJU-ThermoHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Restore and verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Restore project source tree
        shell: bash
        run: |
          set -euo pipefail
          cat source/runtime/part-*.b64 > /tmp/tju-runtime.tar.xz.b64
          python - <<'PY'
          import base64, io, lzma, tarfile
          from pathlib import Path
          root = Path.cwd().resolve()
          encoded = Path('/tmp/tju-runtime.tar.xz.b64').read_text(encoding='ascii')
          payload = base64.b64decode(encoded, validate=True)
          raw = lzma.decompress(payload, format=lzma.FORMAT_XZ)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if member.issym() or member.islnk() or (target != root and root not in target.parents):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              archive.extractall(root)
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run syntax and numerical tests
        run: npm run check
      - name: Build standalone app
        run: npm run build:standalone

  build:
    name: Assemble static Pages site
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Restore project source tree
        shell: bash
        run: |
          set -euo pipefail
          cat source/runtime/part-*.b64 > /tmp/tju-runtime.tar.xz.b64
          python - <<'PY'
          import base64, io, lzma, tarfile
          from pathlib import Path
          root = Path.cwd().resolve()
          payload = base64.b64decode(Path('/tmp/tju-runtime.tar.xz.b64').read_text(encoding='ascii'), validate=True)
          raw = lzma.decompress(payload, format=lzma.FORMAT_XZ)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if member.issym() or member.islnk() or (target != root and root not in target.parents):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              archive.extractall(root)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js .nojekyll _site/
          cp -R assets data _site/
          test -s _site/index.html
          test -s _site/assets/js/core/app.js
          test -s _site/data/chemicals/chemicals.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
